name: Build and Upload Release Assets

on:
  release:
    types: [published]

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed the automatic caching option that triggers the lockfile error

      # This creates the package-lock.json and installs your packages
      - name: Generate package-lock and install
        run: npm install

      - name: Run build script
        run: npm run build

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/index.html
            dist/linkos.url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
